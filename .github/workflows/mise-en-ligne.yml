# Met l'app en ligne sur GitHub Pages à chaque enregistrement sur la branche main.
name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch: # permet aussi de lancer la mise en ligne à la main

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule mise en ligne à la fois ; la plus récente remplace celle en attente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      # Une clé qui n'est pas « publiable » (secrète, service_role…) serait écrite en clair dans les fichiers publiés.
      - name: Vérifier la clé publique Supabase
        env:
          VITE_SUPABASE_CLE_PUBLIQUE: ${{ vars.VITE_SUPABASE_CLE_PUBLIQUE }}
        run: |
          if [ -n "$VITE_SUPABASE_CLE_PUBLIQUE" ] && [[ "$VITE_SUPABASE_CLE_PUBLIQUE" != sb_publishable_* ]]; then
            echo "::error::VITE_SUPABASE_CLE_PUBLIQUE doit commencer par sb_publishable_ (jamais une clé secrète). Mise en ligne arrêtée."
            exit 1
          fi
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_CLE_PUBLIQUE: ${{ vars.VITE_SUPABASE_CLE_PUBLIQUE }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
